# Production Host Nginx Configuration for m2p.lagrieta.es
# Place this file in /etc/nginx/sites-available/m2p.lagrieta.es
# and symlink to /etc/nginx/sites-enabled/ (or conf.d/)

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name m2p.lagrieta.es;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name m2p.lagrieta.es;

    # Cloudflare Origin CA Certificate & Private Key
    ssl_certificate /etc/ssl/certs/lagrieta_origin.pem;
    ssl_certificate_key /etc/ssl/private/lagrieta_origin.key;

    # SSL hardening protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client body size limit for media operations
    client_max_body_size 100M;

    # Reverse proxy to the Docker m2p-web container
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket / SSE support (for download & extraction progress streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
