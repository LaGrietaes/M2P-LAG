# M2P nginx config — production reverse proxy (§32)
# In production, the existing LaGrieta nginx fronts this.
# This file is used by the Docker web image for local dev.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable cache for HTML and Service Worker so updates are immediate
    location ~* (index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache immutable hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://m2p-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://m2p-api:8000/health;
    }
}
